services:
  - type: web
    name: monitor-ps5
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: MALLOC_ARENA_MAX=2 PYTHONMALLOC=malloc uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    plan: free
    autoDeploy: true
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONMALLOC
        value: "malloc"
