<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="wingWhitePro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="proStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="psBluePro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#0070d1"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="proGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base / Sombra Pro -->
  <ellipse cx="100" cy="182" rx="70" ry="14" fill="#000000" opacity="0.75"/>
  <rect x="68" y="174" width="64" height="6.5" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

  <!-- Asa Esquerda Pro -->
  <path d="M 65 26 C 70 16, 84 20, 88 42 L 85 170 C 84 176, 74 177, 70 174 C 62 155, 58 68, 65 26 Z" 
        fill="url(#wingWhitePro)" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- Luz LED Azul / Neon Pro -->
  <path d="M 86 32 L 85 167" stroke="url(#psBluePro)" stroke-width="3" filter="url(#proGlow)"/>

  <!-- Núcleo Central Preto Reforçado -->
  <path d="M 87 32 Q 100 28 113 32 L 115 172 Q 100 175 85 172 Z" 
        fill="#020617"/>

  <!-- AS 3 LISTRAS PRETAS HORIZONTAIS DE VENTILAÇÃO DA VERSÃO PRO (Marcas icônicas do PS5 Pro) -->
  <!-- Listra 1 -->
  <rect x="62" y="94" width="24" height="4.5" rx="1.5" fill="url(#proStripe)" stroke="#000000" stroke-width="0.8"/>
  <rect x="114" y="94" width="24" height="4.5" rx="1.5" fill="url(#proStripe)" stroke="#000000" stroke-width="0.8"/>
  
  <!-- Listra 2 (Central) -->
  <rect x="61" y="103" width="25" height="5" rx="1.5" fill="url(#proStripe)" stroke="#000000" stroke-width="0.8"/>
  <rect x="114" y="103" width="25" height="5" rx="1.5" fill="url(#proStripe)" stroke="#000000" stroke-width="0.8"/>
  
  <!-- Listra 3 -->
  <rect x="62" y="113" width="24" height="4.5" rx="1.5" fill="url(#proStripe)" stroke="#000000" stroke-width="0.8"/>
  <rect x="114" y="113" width="24" height="4.5" rx="1.5" fill="url(#proStripe)" stroke="#000000" stroke-width="0.8"/>

  <!-- Luz LED Azul Direita -->
  <path d="M 114 32 L 113 167" stroke="url(#psBluePro)" stroke-width="3" filter="url(#proGlow)"/>

  <!-- Asa Direita Pro -->
  <path d="M 112 42 C 116 20, 130 16, 135 26 C 142 68, 138 155, 130 174 C 126 177, 116 176, 115 170 L 112 42 Z" 
        fill="url(#wingWhitePro)" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- Portas USB-C frontais duplas Pro -->
  <rect x="98.5" y="82" width="3.5" height="1.8" rx="0.6" fill="#60a5fa"/>
  <rect x="98.5" y="89" width="3.5" height="1.8" rx="0.6" fill="#60a5fa"/>

  <!-- Emblema PRO Dourado / Premium -->
  <rect x="140" y="38" width="46" height="24" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
  <text x="163" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#eab308" text-anchor="middle" letter-spacing="1">PRO</text>
  <circle cx="146" cy="50" r="2" fill="#38bdf8"/>
</svg>
