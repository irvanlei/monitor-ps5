<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ps1Grey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="retroDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="whiteLed30th" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="annivGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base / Sombra -->
  <ellipse cx="100" cy="180" rx="65" ry="12" fill="#000000" opacity="0.6"/>
  <rect x="70" y="172" width="60" height="6" rx="3" fill="#475569" stroke="#64748b" stroke-width="1"/>

  <!-- Asa Esquerda Cinza Clássico PS1 Original (1994 Retro Grey) -->
  <path d="M 68 30 C 72 20, 85 24, 88 45 L 86 168 C 85 174, 76 175, 72 172 C 65 155, 62 70, 68 30 Z" 
        fill="url(#ps1Grey)" stroke="#64748b" stroke-width="1.5"/>

  <!-- O Icônico Logo Colorido Clássico do PlayStation 1 no Topo da Asa -->
  <!-- 'P' ereto Vermelho -->
  <path d="M 75 42 L 75 56 L 79 56 C 82 56, 84 54, 84 49 C 84 44, 82 42, 79 42 Z" fill="#ef4444"/>
  <path d="M 78 45 L 78 50 L 79.5 50 C 80.5 50, 81.5 49, 81.5 47.5 C 81.5 46, 80.5 45, 79.5 45 Z" fill="#cbd5e1"/>
  <!-- 'S' deitado Amarelo / Verde / Azul em perspectiva -->
  <path d="M 73 55 L 87 55 L 85 58 L 75 58 Z" fill="#eab308"/>
  <path d="M 72 58 L 84 58 L 82 61 L 70 61 Z" fill="#10b981"/>
  <path d="M 69 61 L 81 61 L 79 64 L 67 64 Z" fill="#0284c7"/>

  <!-- Micro Símbolos Clássicos PlayStation △ ○ ✕ ▢ em relevo cinza sutil -->
  <!-- Triângulo Verde -->
  <path d="M 73 95 L 76 90 L 79 95 Z" stroke="#10b981" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- Círculo Vermelho -->
  <circle cx="76" cy="107" r="3" stroke="#ef4444" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- Xis Azul -->
  <path d="M 74 118 L 78 122 M 78 118 L 74 122" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <!-- Quadrado Rosa -->
  <rect x="73.5" y="131" width="5.5" height="5.5" stroke="#ec4899" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Luz LED Retrô Esquerda -->
  <path d="M 86 35 L 85 165" stroke="url(#whiteLed30th)" stroke-width="2.6" filter="url(#annivGlow)"/>

  <!-- Núcleo Central Cinza Escuro Retrô -->
  <path d="M 87 35 Q 100 32 113 35 L 114 170 Q 100 173 86 170 Z" fill="url(#retroDark)"/>

  <!-- Luz LED Retrô Direita -->
  <path d="M 114 35 L 113 165" stroke="url(#whiteLed30th)" stroke-width="2.6" filter="url(#annivGlow)"/>

  <!-- Asa Direita Cinza Clássico PS1 -->
  <path d="M 112 45 C 115 24, 128 20, 132 30 C 138 70, 135 155, 128 172 C 124 175, 115 174, 114 168 L 112 45 Z" 
        fill="url(#ps1Grey)" stroke="#64748b" stroke-width="1.5"/>

  <!-- Inscrição "30th Anniversary" gravada em relevo na Asa Direita -->
  <text x="122" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="6" fill="#64748b" opacity="0.85" transform="rotate(90 122 110)">30th ANNIVERSARY</text>

  <!-- Portas USB-C frontais cinza retrô -->
  <rect x="98.5" y="86" width="3" height="1.5" rx="0.5" fill="#38bdf8"/>
  <rect x="98.5" y="93" width="3" height="1.5" rx="0.5" fill="#94a3b8"/>

  <!-- Badge 30th Anniversary Premium com 4 cores do PS1 -->
  <rect x="134" y="36" width="58" height="25" rx="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="163" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="10" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">30th</text>
  <!-- 4 bolinhas de cores PS1 -->
  <circle cx="142" cy="48" r="1.8" fill="#ef4444"/>
  <circle cx="147" cy="48" r="1.8" fill="#eab308"/>
  <circle cx="178" cy="48" r="1.8" fill="#10b981"/>
  <circle cx="183" cy="48" r="1.8" fill="#0284c7"/>
</svg>
