<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="wingWhiteDig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bodyBlackDig" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="psBlueDig" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0070d1"/>
    </linearGradient>
    <filter id="neonGlowDig" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base / Sombra -->
  <ellipse cx="100" cy="180" rx="60" ry="12" fill="#000000" opacity="0.6"/>
  <rect x="72" y="172" width="56" height="6" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Asa Esquerda Slim Symmetrical -->
  <path d="M 68 30 C 72 20, 85 24, 88 45 L 86 168 C 85 174, 76 175, 72 172 C 65 155, 62 70, 68 30 Z" 
        fill="url(#wingWhiteDig)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Luz LED Azul Esquerda -->
  <path d="M 86 35 L 85 165" stroke="url(#psBlueDig)" stroke-width="2.5" filter="url(#neonGlowDig)"/>

  <!-- Núcleo Central Preto -->
  <path d="M 87 35 Q 100 32 113 35 L 114 170 Q 100 173 86 170 Z" 
        fill="url(#bodyBlackDig)"/>

  <!-- Luz LED Azul Direita -->
  <path d="M 114 35 L 113 165" stroke="url(#psBlueDig)" stroke-width="2.5" filter="url(#neonGlowDig)"/>

  <!-- Asa Direita Slim Simétrica (Sem leitor de disco) -->
  <path d="M 112 45 C 115 24, 128 20, 132 30 C 138 70, 135 155, 128 172 C 124 175, 115 174, 114 168 L 112 45 Z" 
        fill="url(#wingWhiteDig)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Vincos característicos da versão Slim (fendas centrais) -->
  <path d="M 65 104 L 87 102" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 113 102 L 135 104" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Portas USB-C frontais -->
  <rect x="98.5" y="86" width="3" height="1.5" rx="0.5" fill="#38bdf8"/>
  <rect x="98.5" y="93" width="3" height="1.5" rx="0.5" fill="#38bdf8"/>

  <!-- Botão Power -->
  <circle cx="100" cy="158" r="1.5" fill="#64748b"/>

  <!-- Badge Digital Icon (WiFi / Download Cloud) -->
  <circle cx="155" cy="50" r="14" fill="#0284c7" opacity="0.95"/>
  <path d="M 148 52 C 148 48, 162 48, 162 52 C 164 52, 165 54, 165 56 C 165 58, 163 60, 161 60 L 149 60 C 146.5 60, 145 58, 145 56 C 145 54, 146.5 52, 148 52 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 155 53 L 155 58 M 153 56 L 155 58 L 157 56" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
