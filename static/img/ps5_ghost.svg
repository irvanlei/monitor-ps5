<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="samuraiArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="goldAccents" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldLed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="ghostGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base / Sombra -->
  <ellipse cx="100" cy="180" rx="65" ry="12" fill="#000000" opacity="0.8"/>
  <rect x="70" y="172" width="60" height="6" rx="3" fill="#1c1917" stroke="#78716c" stroke-width="1"/>

  <!-- Asa Esquerda Armadura Samurai Matte Black -->
  <path d="M 68 30 C 72 20, 85 24, 88 45 L 86 168 C 85 174, 76 175, 72 172 C 65 155, 62 70, 68 30 Z" 
        fill="url(#samuraiArmor)" stroke="#78716c" stroke-width="1.5"/>

  <!-- Brasão Samurai Mon Dourado na Asa Esquerda -->
  <!-- Círculo externo do brasão -->
  <circle cx="77" cy="75" r="7" stroke="url(#goldAccents)" stroke-width="1.2" fill="none" opacity="0.9"/>
  <!-- Montanha Yōtei / Triângulo estilizado do brasão -->
  <path d="M 77 70 L 82 78 L 72 78 Z" fill="url(#goldAccents)" opacity="0.95"/>
  <circle cx="77" cy="74" r="1.5" fill="#1c1917"/>

  <!-- Folhas de Outono Carmesim (Momiji) flutuando -->
  <path d="M 70 115 Q 73 112 76 114 Q 74 118 70 115 Z" fill="#dc2626" opacity="0.85"/>
  <path d="M 78 135 Q 82 133 84 136 Q 81 139 78 135 Z" fill="#ea580c" opacity="0.85"/>

  <!-- Luz LED Dourada Esquerda -->
  <path d="M 86 35 L 85 165" stroke="url(#goldLed)" stroke-width="2.8" filter="url(#ghostGlow)"/>

  <!-- Núcleo Central Preto Carvão -->
  <path d="M 87 35 Q 100 32 113 35 L 114 170 Q 100 173 86 170 Z" fill="#090a0f"/>

  <!-- Linha Katana Slash Dourada Cruzando o Centro -->
  <path d="M 92 110 L 108 100" stroke="url(#goldAccents)" stroke-width="1" opacity="0.7"/>

  <!-- Luz LED Dourada Direita -->
  <path d="M 114 35 L 113 165" stroke="url(#goldLed)" stroke-width="2.8" filter="url(#ghostGlow)"/>

  <!-- Asa Direita Armadura Samurai com Detalhes Dourados -->
  <path d="M 112 45 C 115 24, 128 20, 132 30 C 138 70, 135 155, 128 172 C 124 175, 115 174, 114 168 L 112 45 Z" 
        fill="url(#samuraiArmor)" stroke="#78716c" stroke-width="1.5"/>

  <!-- Filete Dourado na Asa Direita -->
  <path d="M 120 45 C 124 75, 128 115, 124 155" stroke="url(#goldAccents)" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Folha Carmesim flutuando na direita -->
  <path d="M 122 90 Q 125 87 128 89 Q 126 93 122 90 Z" fill="#dc2626" opacity="0.8"/>

  <!-- Portas USB-C frontais com luz âmbar -->
  <rect x="98.5" y="86" width="3" height="1.5" rx="0.5" fill="#fbbf24"/>
  <rect x="98.5" y="93" width="3" height="1.5" rx="0.5" fill="#fbbf24"/>

  <!-- Badge Ghost Especial -->
  <rect x="136" y="36" width="54" height="24" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="163" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="9.5" fill="#fbbf24" text-anchor="middle" letter-spacing="1">GHOST</text>
  <circle cx="143" cy="48" r="2" fill="#f59e0b"/>
</svg>
